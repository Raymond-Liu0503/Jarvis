version: 1.2.0
label: Product Research
disclaimer: Observed prices are snapshots; verify price and availability with the seller.
tools: [commerceSnapshot, webSearch]
intake:
  - { id: product, description: product description or public URL, question: What product or public product URL should I research? }
  - id: requirements
    description: intended use must-haves preferences budget compatibility and region
    question: Which requirements or constraints would materially affect the choice?
    requiredWhen: Missing requirements would change product fit or the recommendation.
prompts: { quick: references/quick.md, synthesis: references/synthesis.md }
limits: { deepToolRounds: 3 }
lenses:
  - { id: fit, label: Specifications & fit, focus: exact variants requirements specifications compatibility and regional differences, mission: Determine whether exact candidates satisfy the user's requirements, prompt: references/fit.md, tools: [commerceSnapshot, webSearch], minimumSources: 2, preferredSourceTypes: [commerce, web] }
  - { id: price, label: Price & alternatives, focus: observed price and competing products, mission: Compare current value and credible substitutes, prompt: references/price.md, tools: [commerceSnapshot, webSearch], minimumSources: 2, preferredSourceTypes: [commerce, web], freshness: { maxAgeHours: 6 } }
  - { id: reliability, label: Reviews & reliability, focus: independent tests owner reports support lifecycle and review manipulation, mission: Identify repeated strengths failure modes and evidence bias, prompt: references/reliability.md, tools: [webSearch], minimumSources: 2, preferredSourceTypes: [web], freshness: { publishedWithinDays: 1095 } }
