id: finance
mode: stocks
label: Finance
version: 1.0.0
description: Research public companies, markets, filings, and investment risks.
accent: lime
disclaimer: Informational research only — not personalized financial advice.
requiredIntake:
  - ticker or company
prompts:
  quick: prompts/quick.md
  synthesis: prompts/synthesis.md
tools:
  - financialDatasets
  - marketData
  - marketOverview
  - webSearch
limits:
  sourceBudget: 20
  quickSearchRounds: 1
  deepToolRounds: 3
lenses:
  - id: fundamentals
    label: Fundamentals & filings
    focus: financial statements, earnings, and filings
    mission: Establish what the business earns, owns, owes, and has formally disclosed.
    prompt: prompts/fundamentals.md
    tools: [financialDatasets, marketData, webSearch]
    minimumSources: 2
    preferredSourceTypes: [filing, market, web]
  - id: market
    label: Market & news
    focus: price context, catalysts, and current news
    mission: Explain current price action and time-sensitive catalysts without overstating causality.
    prompt: prompts/market-news.md
    tools: [marketData, marketOverview, webSearch]
    minimumSources: 2
    preferredSourceTypes: [market, news, web]
  - id: risk
    label: Risk & comparables
    focus: risks, valuation, and peers
    mission: Challenge the thesis with comparable companies, valuation context, and credible downside cases.
    prompt: prompts/risk-comparables.md
    tools: [financialDatasets, marketData, webSearch]
    minimumSources: 2
    preferredSourceTypes: [filing, market, news, web]
