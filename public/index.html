<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <h1>Jarvis</h1>
          <p>Baseline agentic chat with voice input/output</p>
        </div>
        <div class="header-controls">
          <button
            id="voiceToggle"
            class="toggle-btn"
            aria-label="Toggle voice response"
          >
            🔊 Voice On
          </button>
          <div class="status" id="status">Idle</div>
        </div>
      </header>

      <main class="chat" id="chat"></main>

      <footer class="composer">
        <button id="recordBtn" class="icon-btn" aria-label="Record">
          <span id="recordIcon">🎙️</span>
        </button>
        <input id="textInput" type="text" placeholder="Type a message" />
        <button id="sendBtn" class="primary">Send</button>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
